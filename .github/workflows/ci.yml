name: ci

# Hackathon fast gate (~2 min, one job): build, typecheck, lint, secret scan, and the unit tests
# related to the PR's changes. The full suite (all unit + every *.db.test.ts) runs locally before
# each PR and in the final local review, not in Actions. PR-only; docs-only and draft PRs skip.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (full history, every ref)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          npm run security:secrets
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests related to this PR's changes
        run: npx vitest run --project unit --project web --changed origin/${{ github.base_ref || 'main' }} --passWithNoTests --maxWorkers=2
