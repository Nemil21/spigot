name: ci

# Whole-repo check on every PR and every push to main (no path filter), so lockfile drift or a
# break in any workspace is caught. Tickets never edit this file: DB-backed tests are named
# `*.db.test.ts` and run in the `db` job's single vitest line.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate an empty database twice (idempotent)
        run: npm run migrate && npm run migrate
      - name: Schema constraint tests (db/test)
        run: npm run test:db
      - name: DB-backed tests (every *.db.test.ts)
        run: npx vitest run --project db --maxWorkers=2

  # Gitleaks over the full history (every ref) and npm audit clean of highs.
  security:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Secret scan (full history)
        run: npm run security:secrets
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependency audit (no highs)
        run: npm run security:audit
