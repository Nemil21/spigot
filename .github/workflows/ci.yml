name: ci

# One job per PR (Actions minutes are billed per job, rounded up, so one runner beats three).
# Not run on pushes to main: PRs are rebased on main before merge, so main is what the PR tested.
# Docs-only changes and draft PRs skip CI. DB-backed tests are named `*.db.test.ts` and run in the
# single vitest db line below; tickets never edit this file.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (full history, every ref)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          npm run security:secrets
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Migrate an empty database twice (idempotent)
        run: npm run migrate && npm run migrate
      - name: Schema constraint tests (db/test)
        run: npm run test:db
      - name: DB-backed tests (every *.db.test.ts)
        run: npx vitest run --project db --maxWorkers=2
      - name: Dependency audit (no highs)
        run: npm run security:audit
