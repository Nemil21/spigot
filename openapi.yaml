  /v1/topups:
    post:
      operationId: createTopup
      tags:
        - Balance
      summary: Start a PayPal top-up (returns an approval link)
      description: Creates a PayPal order for `amountCents` and returns `approveUrl` for a human to open; PayPal returns them to Spigot, which captures and credits the balance once. Replaying the same request (same `Idempotency-Key`) returns the same top-up, with its final status once finished (`COMPLETED` adds `balanceMicros`). Needs the `topup` scope.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
            description: "Makes a retry safe: the same key and the same request replay the stored response (`Spigot-Replay: true`) and never charge twice; the same key with a different request is `409 IDEMPOTENCY_MISMATCH`. Keys are scoped to your API key. **Without this header, retries are deduplicated only within the same minute** (the server derives a key from the request and the current minute), so a retry that crosses a minute boundary is a new call. Send the header for exact retry safety."
          required: false
          description: "Makes a retry safe: the same key and the same request replay the stored response (`Spigot-Replay: true`) and never charge twice; the same key with a different request is `409 IDEMPOTENCY_MISMATCH`. Keys are scoped to your API key. **Without this header, retries are deduplicated only within the same minute** (the server derives a key from the request and the current minute), so a retry that crosses a minute boundary is a new call. Send the header for exact retry safety."
          name: Idempotency-Key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopupRequest"
      responses:
