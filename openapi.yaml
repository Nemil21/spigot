          description: "Over the per-minute limit; retry after `Retry-After` seconds. Codes: `RATE_LIMITED`."
          headers:
            RateLimit-Limit:
              schema:
                type: integer
                description: Calls allowed per minute for this key (or IP).
              required: true
              description: Calls allowed per minute for this key (or IP).
            RateLimit-Remaining:
              schema:
                type: integer
                description: Calls left in the current window.
              required: true
              description: Calls left in the current window.
            Retry-After:
              schema:
                type: integer
                description: Seconds to wait.
              required: true
