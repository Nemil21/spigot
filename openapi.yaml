          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "The `Idempotency-Key` was used with a different request. Codes: `IDEMPOTENCY_MISMATCH`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
