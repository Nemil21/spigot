openapi: 3.1.0
info:
  title: Spigot data API
  version: 1.0.0
  description: |-
    Spigot's buyer data API: structured records from publisher sites, paid per record from a prepaid balance (topped up with PayPal).

    **Auth.** `Authorization: Bearer sk_spg_…` (create keys in the buyer portal; scopes `read`, `topup`). `GET /v1/catalog`, `GET /v1/{site}/datasets/{dataset}` and this document are free and need no key. Calling a paid route **without a key** returns `402 PAYMENT_REQUIRED` with the catalog and how to pay (not 401); a malformed, unknown or revoked key is `401`.

    **Money.** Prices and balances are integer **micros** of USD (`1500` = $0.0015); top-up amounts are **cents**.

    **Filters.** Filters: `field[op]=value` (op defaults to `eq`). Ops: eq, lt, lte, gt, gte, in (comma-separated, max 50). Only fields `GET /v1/{site}/datasets/{dataset}` marks filterable; `updated_at[gte]` always works. Unknown fields or ops → `400 UNSUPPORTED_FILTER` listing the valid ones.

    **Idempotency.** Paid reads and `POST /v1/topups` take an optional `Idempotency-Key` header. Makes a retry safe: the same key and the same request replay the stored response (`Spigot-Replay: true`) and never charge twice; the same key with a different request is `409 IDEMPOTENCY_MISMATCH`. Keys are scoped to your API key. **Without this header, retries are deduplicated only within the same minute** (the server derives a key from the request and the current minute), so a retry that crosses a minute boundary is a new call. Send the header for exact retry safety.

    **Rate limits.** 60 calls/min per API key (keyless calls to paid routes: per client IP) → `429 RATE_LIMITED` with `Retry-After`.

    **Errors.** `{ "error": { "code", "message", "details"? } }`. A 402 adds the payment fields (`site`, `datasets`, `pay`, `terms`, and the quote).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://spigot.onrender.com
