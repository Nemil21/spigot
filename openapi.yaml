              schema:
                $ref: "#/components/schemas/Catalog"
  /v1/openapi.yaml:
    get:
      operationId: getOpenApi
      tags:
        - Catalog
      summary: This OpenAPI document (free)
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 document for `/v1`.
          content:
            application/yaml:
              schema:
                type: string
  /v1/{site}/datasets/{dataset}:
    get:
      operationId: describeDataset
      tags:
        - Catalog
      summary: Dataset schema, filterable fields and ops, pricing (free)
      security: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 100
            description: Site slug, e.g. `bluebonnet`.
          required: true
          description: Site slug, e.g. `bluebonnet`.
          name: site
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 100
            description: Dataset slug, e.g. `listings`.
          required: true
          description: Dataset slug, e.g. `listings`.
          name: dataset
          in: path
      responses:
        "200":
          description: The dataset description.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetDescription"
        "400":
          description: "Invalid path, query, header or body. Codes: `VALIDATION_ERROR`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: "Unknown site or dataset (or record), or a dataset not published. Codes: `NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: "The dataset was unpublished, or the cursor is older than the retained history. Codes: `DATASET_UNPUBLISHED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/{site}/datasets/{dataset}/quote:
    get:
      operationId: quoteRecords
      tags:
        - Records
      summary: Price a records query without running it (free)
      description: Counts the records the same query would return (capped at `limit`) and prices them. Takes the same filters as `records`. Nothing is charged.
      security:
        - bearerAuth: []
      parameters:
        - name: filters
          in: query
          required: false
          style: form
          explode: true
          description: "Filters: `field[op]=value` (op defaults to `eq`). Ops: eq, lt, lte, gt, gte, in (comma-separated, max 50). Only fields `GET /v1/{site}/datasets/{dataset}` marks filterable; `updated_at[gte]` always works. Example: `bedrooms[gte]=3&price_usd[lt]=2000&city=Austin`."
          schema:
            type: object
            additionalProperties:
              type: string
          example:
            bedrooms[gte]: "3"
            price_usd[lt]: "2000"
            city: Austin
        - schema:
            type: string
            minLength: 1
            maxLength: 100
            description: Site slug, e.g. `bluebonnet`.
          required: true
          description: Site slug, e.g. `bluebonnet`.
          name: site
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 100
            description: Dataset slug, e.g. `listings`.
          required: true
          description: Dataset slug, e.g. `listings`.
          name: dataset
          in: path
        - schema:
            type: string
            maxLength: 2000
            description: Records to price (default 50, max the dataset's max_records_per_call).
          required: false
          description: Records to price (default 50, max the dataset's max_records_per_call).
          name: limit
          in: query
        - schema:
            type: string
            maxLength: 2000
            description: "`-updated_at` (default) or `updated_at`."
          required: false
          description: "`-updated_at` (default) or `updated_at`."
          name: sort
          in: query
        - schema:
            type: string
            maxLength: 2000
            description: Keyset cursor from a previous page's `next`.
          required: false
          description: Keyset cursor from a previous page's `next`.
          name: cursor
          in: query
      responses:
        "200":
          description: The quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          description: "Invalid path, query, header or body. Codes: `VALIDATION_ERROR`, `UNSUPPORTED_FILTER`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: "Missing, malformed, unknown or revoked API key. Codes: `UNAUTHENTICATED`, `KEY_REVOKED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: "The API key lacks the `read` scope. Codes: `FORBIDDEN`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: "Unknown site or dataset (or record), or a dataset not published. Codes: `NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: "The dataset was unpublished, or the cursor is older than the retained history. Codes: `DATASET_UNPUBLISHED`, `CURSOR_EXPIRED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
