# Host nginx in front of docker-compose.yml. Replace the two server_names, then:
#   sudo cp deploy/nginx/spigot.conf /etc/nginx/sites-available/spigot
#   sudo ln -s /etc/nginx/sites-available/spigot /etc/nginx/sites-enabled/spigot
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d spigot.example.com -d bluebonnet.example.com

# API, dashboard, buyer portal, /v1, /mcp, catalog page.
server {
    listen 80;
    server_name spigot.example.com;
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE (dashboard live updates, crawl progress) and Streamable HTTP MCP stay open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Bluebonnet Rentals demo site (spigot-gate installed).
server {
    listen 80;
    server_name bluebonnet.example.com;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
