# Self-hosted Spigot: Postgres 16, the API (dashboard, /v1, /mcp, catalog) and the Bluebonnet demo
# site, behind a host nginx (deploy/nginx/spigot.conf). See docs/deploy-docker.md.
#
#   docker compose up -d --build
#   docker compose exec api npm run seed:demo
#
# `.env` (API, also read here for ${...}) and `.env.demo-site` live next to this file, git-ignored.
name: spigot

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spigot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: spigot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spigot -d spigot']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      args:
        VITE_AG_GRID_LICENSE_KEY: ${VITE_AG_GRID_LICENSE_KEY:-}
        VITE_PAYPAL_CLIENT_ID: ${VITE_PAYPAL_CLIENT_ID:-}
    image: spigot:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://spigot:${POSTGRES_PASSWORD}@db:5432/spigot
      HOST: 0.0.0.0
      PORT: '3000'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    mem_limit: 1500m

  demo-site:
    image: spigot:latest
    restart: unless-stopped
    command: ['node', 'apps/demo-site/dist/server.js']
    env_file: .env.demo-site
    environment:
      PORT: '4100'
      DEMO_DATA_DIR: /data/bluebonnet
      # 25 listings (+ 1 agent, 1 open house): a crawl and proposal that finish in seconds live.
      # Not below 20: URL clustering needs >= 20 distinct /listings/<slug> pages to see a record
      # type (CLUSTER_DEFAULTS.paramMinDistinct), so 10 gives no proposal. Full size:
      # DEMO_LISTINGS=2341 in .env (then Agent and Open House are proposed too).
      DEMO_LISTINGS: ${DEMO_LISTINGS:-25}
    volumes:
      - demodata:/data
    depends_on:
      - api
    ports:
      - '127.0.0.1:${DEMO_SITE_PORT:-4100}:4100'
    mem_limit: 600m

volumes:
  pgdata:
  demodata:
